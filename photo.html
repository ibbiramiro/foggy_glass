<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Fog Glass - Your Photo</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; background: #0a1016; color: #cfeaff;
            font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center;
            padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
            background-image: radial-gradient(ellipse at top, rgba(160, 220, 255, 0.12), transparent 60%);
        }
        h1 {
            font-size: 15px; letter-spacing: 2px; margin: 4px 0 16px; text-align: center;
            text-shadow: 0 0 10px rgba(160, 220, 255, 0.9);
        }
        .frame {
            width: 100%; max-width: 720px; border: 1px solid rgba(207, 234, 255, 0.5);
            box-shadow: 0 0 30px rgba(160, 220, 255, 0.2); background: #000; min-height: 120px;
            display: flex; align-items: center; justify-content: center;
        }
        .frame img { width: 100%; height: auto; display: block; -webkit-touch-callout: default; }
        .actions { display: flex; gap: 10px; width: 100%; max-width: 720px; margin-top: 16px; }
        .btn {
            flex: 1; font-family: inherit; font-weight: bold; font-size: 15px; letter-spacing: 1px;
            color: #0a1016; background: #cfeaff; border: 1px solid #cfeaff; padding: 14px 10px;
            cursor: pointer; border-radius: 0; -webkit-appearance: none; appearance: none;
        }
        .btn.secondary { color: #cfeaff; background: rgba(207, 234, 255, 0.08); }
        .btn:disabled { opacity: 0.45; cursor: default; }
        .btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
        #status { margin-top: 14px; font-size: 13px; min-height: 18px; text-align: center; color: #8fd3ff; }
        .hint { margin-top: 8px; font-size: 11px; color: rgba(207, 234, 255, 0.6); text-align: center; max-width: 720px; line-height: 1.6; }
    </style>
</head>
<body>
    <h1>FOG_GLASS // YOUR PHOTO</h1>

    <div class="frame"><img id="photo" alt="Foto Fog Glass kamu"></div>

    <div class="actions">
        <button id="save_btn" class="btn" type="button" disabled>SAVE PHOTO</button>
        <button id="share_btn" class="btn secondary" type="button" disabled>SHARE</button>
    </div>
    <div id="status" role="status" aria-live="polite">Memuat foto...</div>
    <div class="hint" id="hint">iPhone: tekan SAVE PHOTO lalu pilih "Save Image", atau tekan lama foto lalu "Save to Photos".</div>

    <script src="config.js"></script>
    <script>
        const APP = Object.assign({ SUPABASE_URL: '', BUCKET: 'fog-glass', FOLDER: 'photos' }, window.FOG_GLASS_CONFIG || {});
        const photoEl = document.getElementById('photo');
        const saveBtn = document.getElementById('save_btn');
        const shareBtn = document.getElementById('share_btn');
        const statusEl = document.getElementById('status');

        const isTouch = window.matchMedia('(pointer: coarse)').matches;
        let file = null, objectUrl = null, fileName = 'fog-glass.jpg';

        // Hanya terima path foto milik app ini (bukan URL bebas), supaya halaman tidak bisa dipakai menampilkan gambar lain
        const path = new URLSearchParams(location.search).get('p') || '';
        const folderRe = APP.FOLDER.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const validPath = new RegExp(`^${folderRe}/\\d{4}-\\d{2}-\\d{2}/[A-Za-z0-9-]+\\.jpg$`).test(path);

        function setStatus(t) { statusEl.textContent = t; }

        async function load() {
            if (!APP.SUPABASE_URL || !validPath) { setStatus('Link foto tidak valid.'); return; }

            const publicUrl = `${APP.SUPABASE_URL.replace(/\/$/, '')}/storage/v1/object/public/${encodeURIComponent(APP.BUCKET)}/${path.split('/').map(encodeURIComponent).join('/')}`;
            const day = path.split('/')[1];
            fileName = `fog-glass-${day}-${path.split('/').pop().slice(0, 8)}.jpg`;

            try {
                // Blob diambil di awal: navigator.share() di iOS harus dipanggil langsung dari tap, tanpa await fetch
                const res = await fetch(publicUrl);
                if (!res.ok) throw new Error(res.status === 404 || res.status === 400 ? 'Foto tidak ditemukan atau sudah dihapus.' : `HTTP ${res.status}`);
                const blob = await res.blob();
                file = new File([blob], fileName, { type: 'image/jpeg' });
                objectUrl = URL.createObjectURL(blob);
                photoEl.src = objectUrl;
                saveBtn.disabled = false;
                shareBtn.disabled = false;
                setStatus('');
            } catch (err) {
                // Fallback: tampilkan langsung dari URL publik (tetap bisa long-press untuk simpan)
                console.error(err);
                photoEl.src = publicUrl;
                photoEl.onerror = () => setStatus('Foto tidak ditemukan atau sudah dihapus.');
                setStatus(err.message || 'Gagal memuat foto.');
            }
        }

        const canShareFile = () => !!(file && navigator.canShare && navigator.canShare({ files: [file] }));

        function downloadFile() {
            const a = document.createElement('a');
            a.href = objectUrl; a.download = fileName;
            document.body.appendChild(a); a.click(); a.remove();
            setStatus('Foto tersimpan ke folder Downloads.');
        }

        async function shareFile(opts) {
            try {
                await navigator.share(opts);
                return true;
            } catch (err) {
                if (err.name === 'AbortError') return true;   // user batal, bukan error
                console.error(err);
                return false;
            }
        }

        // SAVE: di HP pakai share sheet (satu-satunya cara web menyimpan ke Photos/Galeri di iOS), di desktop download biasa
        saveBtn.addEventListener('click', async () => {
            if (isTouch && canShareFile()) {
                if (await shareFile({ files: [file] })) return;
            }
            downloadFile();
        });

        // SHARE: kirim file foto, fallback ke link, fallback lagi ke salin link
        shareBtn.addEventListener('click', async () => {
            if (canShareFile() && await shareFile({ files: [file], title: 'Fog Glass' })) return;
            if (navigator.share && await shareFile({ title: 'Fog Glass', url: location.href })) return;
            try {
                await navigator.clipboard.writeText(location.href);
                setStatus('Link disalin ke clipboard.');
            } catch {
                setStatus('Tidak bisa share di browser ini. Salin link dari address bar.');
            }
        });

        if (!isTouch) document.getElementById('hint').textContent = 'Klik SAVE PHOTO untuk download, atau SHARE untuk membagikan.';
        load();
    </script>
</body>
</html>
